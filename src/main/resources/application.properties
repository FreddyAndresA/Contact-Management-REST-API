spring.application.name=Contact-Management
server.port=${PORT:8080}

spring.datasource.url=${CONTACT_MANAGEMENT_DB_HOST}
spring.datasource.username=${CONTACT_MANAGEMENT_DB_USER}
spring.datasource.password=${CONTACT_MANAGEMENT_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true